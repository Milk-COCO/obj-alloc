[package]
name = "obj-alloc"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "自用 field-collex 可序列化K-V封装"
repository = "https://github.com/Milk-COCO/obj-alloc"

[dependencies]
field-collex = { path = "../field-collex" }
#field-collex = "0.1.0"
jump-array = { path = "../jump-array" }
serde = "^1.0"
serde_json = "^1.0"

[features]
default = []
# 分数排序键（`fraction::Ratio<T>`）支持，转发给 jump-array。
ratio = ["jump-array/ratio"]
